name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SQL_PASSWORD: CentralRouting!Ci2026

jobs:
  build:
    runs-on: ubuntu-latest

    # The SQL Server store, deduplication and acceptance tests run against it; without it they are ignored
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CentralRouting!Ci2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CentralRouting!Ci2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer computes the version from tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NServiceBus.Community.Routing.sln

      - name: Build and pack
        run: dotnet build NServiceBus.Community.Routing.sln --configuration Release --no-restore

      # Separate databases: the store tests drop and recreate theirs
      - name: Unit tests
        run: dotnet test NServiceBus.Community.Routing.Tests/NServiceBus.Community.Routing.Tests.csproj --configuration Release --no-build --logger trx --results-directory TestResults
        env:
          CentralRouting_SqlServer_ConnectionString: Server=localhost,1433;Database=CentralRoutingStoreTests;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=true

      - name: Acceptance tests
        run: dotnet test NServiceBus.Community.Routing.AcceptanceTests/NServiceBus.Community.Routing.AcceptanceTests.csproj --configuration Release --no-build --logger trx --results-directory TestResults
        env:
          CentralRouting_SqlServer_ConnectionString: Server=localhost,1433;Database=CentralRoutingTests;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=true

      - name: Build samples
        run: |
          for solution in Samples/*/*.sln; do
            dotnet build "$solution" --configuration Release
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

  # The router host image, tagged with the MinVer version and latest. Pushed to ghcr.io from master and v* tags; pull requests only build it.
  container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: github.event_name == 'pull_request'
        run: dotnet publish NServiceBus.Community.Routing.Router.Host --configuration Release -t:PublishContainer -p:ContainerArchiveOutputPath=$RUNNER_TEMP/nservicebus-community-router.tar.gz

      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          dotnet publish NServiceBus.Community.Routing.Router.Host --configuration Release -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${GITHUB_REPOSITORY_OWNER,,}/nservicebus-community-router

  # The packages the build job created, versioned from the tag, pushed to nuget.org with trusted publishing: the job trades
  # its GitHub token for a short-lived API key. Needs the NUGET_USER secret (the nuget.org profile name) and a trusted
  # publishing policy on nuget.org for this repository and ci.yml.
  nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Symbol packages (.snupkg) next to them are pushed too; a version already on nuget.org is skipped when a run is repeated
      - name: Push to nuget.org
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
